<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FuelUp">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>FuelUp – Anmelden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="statusbar">
    <span class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>FuelUp</h1></span>
  </header>
  <main class="login">
    <form id="login-form" class="card">
      <h2>Anmelden</h2>
      <p id="error" class="banner error" role="alert" hidden></p>
      <label>Passwort
        <input id="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p><button type="submit" class="primary">Anmelden</button></p>
    </form>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
